[project]
name = "wallaby-mw-pipeline"
version = "0.1.0"
description = "WALLABY Milky Way combination and source finding pipeline"
requires-python = ">=3.8"
dependencies = [
    "prefect<3",
    "vos",
    "astropy",
    "astroquery",
    "numpy",
    "reproject",
    "wget",
    "keyring",
    "keyrings.alt",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
